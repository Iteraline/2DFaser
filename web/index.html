<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>A Lápiz</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A Lápiz">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1d24">
<link rel="preload" href="/fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="app">
  <header id="hud" class="hud" hidden>
    <div class="row">
      <div id="hLives" class="lives" aria-label="Vidas"></div>
      <div class="page-n"><span id="hPage">1</span><small>/10</small></div>
      <div id="hStars" class="stars" aria-label="Estrellas"></div>
      <div class="score" id="hScore">0</div>
      <button type="button" id="pause" class="icon-btn" aria-label="Pausa">❚❚</button>
    </div>
    <div class="row row2">
      <div class="lead" aria-label="Mina"><canvas id="leadIcon" width="44" height="44"></canvas><div class="bar"><i id="hLead"></i></div></div>
      <div id="hInv" class="inv"></div>
    </div>
  </header>
  <div id="stage" class="stage"><canvas id="cv"></canvas></div>
  <p id="toast" class="toast" hidden></p>

  <section id="title" class="title">
    <div class="cover">
      <p class="label">Cuaderno de Matemáticas</p>
      <h1>A Lápiz</h1>
      <p class="sub">Recorre el laberinto sin equivocarte. La goma te persigue.</p>
      <button type="button" id="play" class="main big">Jugar</button>
      <p id="best" class="best"></p>
      <ul class="how">
        <li><b>Desliza</b> para mover el lápiz · <b>toca</b> para parar</li>
        <li>No puedes cruzar tu trazo. Volver atrás gasta el doble de mina</li>
        <li>Llega al agujero del borde derecho y pasa la hoja</li>
      </ul>
    </div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mdTitle">
    <p id="mdKicker" class="kicker"></p>
    <h2 id="mdTitle"></h2>
    <div id="mdBody"></div>
    <div id="mdChoices" class="choices"></div>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
